<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNSEEN | Email Confirmation</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #100c19;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 42px 28px;
      background: #1b1427;
      border: 1px solid #38283f;
      border-radius: 28px;
    }
    .logo {
      color: #f05b9b;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 7px;
    }
    h1 { font-size: 25px; margin-top: 32px; }
    p { color: #c7becf; line-height: 1.7; }
    .note { font-size: 13px; margin-top: 28px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">UNSEEN</div>
    <h1>Welcome to UNSEEN</h1>
    <p>
      Your email confirmation link has been opened.
      Return to the UNSEEN app and log in to continue.
    </p>
    <p class="note">
      If you cannot log in, your email may not have
      been verified successfully. Please try again.
    </p>
  </main>
</body>
</html>
